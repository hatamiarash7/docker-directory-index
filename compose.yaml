services:
  directory-index:
    image: hatamiarash7/directory-index:latest
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - type: bind
        source: ./public
        target: /data
        read_only: true
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
